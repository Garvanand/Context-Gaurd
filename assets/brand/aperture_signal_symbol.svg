<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- ContextGuard: The Aperture Signal (Spectral Signal Identity) -->
  <defs>
    <linearGradient id="cg_wing_alpha" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A28DFF" />
      <stop offset="60%" stop-color="#8B70FF" />
      <stop offset="100%" stop-color="#6E4FFF" />
    </linearGradient>
    <linearGradient id="cg_wing_beta" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5BF0FF" />
      <stop offset="100%" stop-color="#2FD5F6" />
    </linearGradient>
  </defs>

  <!-- Wing Alpha: Outer Signal Contour (270° incomplete aperture with engineered 90° intake gap) -->
  <path
    d="M 87.42 43.40
       A 38 38 0 1 1 43.40 12.58
       L 45.14 22.43
       A 28 28 0 1 0 77.57 45.14
       Z"
    fill="url(#cg_wing_alpha)"
  />

  <!-- Wing Beta: Inner Offset Signal Contour (240° concentric offset channel) -->
  <path
    d="M 64.78 67.62
       A 23 23 0 1 1 57.87 28.39
       L 55.13 35.90
       A 15 15 0 1 0 59.64 61.49
       Z"
    fill="url(#cg_wing_beta)"
  />

  <!-- Central Aperture Focal Core (Action-Gating Hemisphere with 45° Discontinuity Slit) -->
  <path
    d="M 42.72 55.44
       A 9 9 0 0 1 55.44 42.72
       Z"
    fill="#D8FF63"
  />

  <!-- Secondary Observer Anchor Point -->
  <circle cx="55.0" cy="55.0" r="2.8" fill="#F4F6FF" />
</svg>
