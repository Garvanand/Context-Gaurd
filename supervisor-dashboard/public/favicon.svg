      d="M 64.78 67.62
         A 23 23 0 1 1 57.87 28.39
         L 55.13 35.90
         A 15 15 0 1 0 59.64 61.49
         Z"
      fill="url(#fav_wing_beta)"
    />

    <!-- Central Aperture Focal Core -->
    <path
      d="M 42.72 55.44
         A 9 9 0 0 1 55.44 42.72
         Z"
      fill="#D8FF63"
    />

    <!-- Observer Anchor -->
    <circle cx="55.0" cy="55.0" r="2.8" fill="#F4F6FF" />
