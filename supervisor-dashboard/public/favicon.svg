<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- ContextGuard: Web Favicon (Aperture Signal) -->
  <defs>
    <linearGradient id="fav_wing_alpha" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A28DFF" />
      <stop offset="60%" stop-color="#8B70FF" />
      <stop offset="100%" stop-color="#6E4FFF" />
    </linearGradient>
    <linearGradient id="fav_wing_beta" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5BF0FF" />
      <stop offset="100%" stop-color="#2FD5F6" />
